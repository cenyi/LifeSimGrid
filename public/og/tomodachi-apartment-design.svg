<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="20" flood-color="rgba(0,0,0,0.2)" />
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.3)" />
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <rect x="60" y="60" width="1080" height="510" rx="32" fill="url(#cardGradient)" filter="url(#shadow)" />

  <!-- Room layout preview -->
  <g transform="translate(100, 130)">
    <!-- Room background -->
    <rect x="0" y="0" width="280" height="280" rx="16" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
    <!-- Grid lines -->
    <g stroke="#e0f2fe" stroke-width="1">
      <line x1="35" y1="0" x2="35" y2="280"/>
      <line x1="70" y1="0" x2="70" y2="280"/>
      <line x1="105" y1="0" x2="105" y2="280"/>
      <line x1="140" y1="0" x2="140" y2="280"/>
      <line x1="175" y1="0" x2="175" y2="280"/>
      <line x1="210" y1="0" x2="210" y2="280"/>
      <line x1="245" y1="0" x2="245" y2="280"/>
      <line x1="0" y1="35" x2="280" y2="35"/>
      <line x1="0" y1="70" x2="280" y2="70"/>
      <line x1="0" y1="105" x2="280" y2="105"/>
      <line x1="0" y1="140" x2="280" y2="140"/>
      <line x1="0" y1="175" x2="280" y2="175"/>
      <line x1="0" y1="210" x2="280" y2="210"/>
      <line x1="0" y1="245" x2="280" y2="245"/>
    </g>
    <!-- Bed -->
    <rect x="20" y="20" width="60" height="40" rx="6" fill="#818cf8" opacity="0.8"/>
    <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">🛏️</text>
    <!-- Sofa -->
    <rect x="180" y="20" width="80" height="40" rx="6" fill="#f59e0b" opacity="0.8"/>
    <text x="220" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">🛋️</text>
    <!-- Table -->
    <rect x="100" y="100" width="60" height="40" rx="6" fill="#22c55e" opacity="0.8"/>
    <text x="130" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">🪑</text>
    <!-- Plant -->
    <rect x="20" y="200" width="35" height="35" rx="6" fill="#16a34a" opacity="0.8"/>
    <text x="37" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">🪴</text>
    <!-- TV -->
    <rect x="220" y="200" width="40" height="35" rx="6" fill="#64748b" opacity="0.8"/>
    <text x="240" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">📺</text>
    <!-- Lamp -->
    <rect x="100" y="200" width="35" height="35" rx="6" fill="#eab308" opacity="0.8"/>
    <text x="117" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">💡</text>
  </g>

  <!-- Title section -->
  <text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" filter="url(#textShadow)">LifeSimGrid</text>

  <text x="600" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#1e293b">Tomodachi Life</text>
  <text x="600" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#0284c7">Apartment Design</text>
  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748b">Interactive Room Layout &amp; Furniture Tool</text>

  <!-- Feature tags -->
  <g transform="translate(360, 390)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#0284c7" opacity="0.1"/>
    <text x="70" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0284c7">🏠 Room Layout</text>
  </g>
  <g transform="translate(520, 390)">
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#f59e0b" opacity="0.1"/>
    <text x="80" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">🪑 Furniture Placement</text>
  </g>
  <g transform="translate(700, 390)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#22c55e" opacity="0.1"/>
    <text x="65" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e">📤 Export Design</text>
  </g>

  <!-- Grid icon decoration -->
  <g transform="translate(1050, 550)">
    <circle cx="0" cy="0" r="30" fill="#0284c7"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">🏠</text>
  </g>

  <rect x="60" y="590" width="1080" height="2" rx="1" fill="#e2e8f0" opacity="0.5"/>
</svg>
