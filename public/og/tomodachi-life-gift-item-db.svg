<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf2f8"/>
      <stop offset="0.5" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gift boxes -->
  <g transform="translate(60,100)">
    <rect width="140" height="140" rx="12" fill="#ffffff" stroke="#f9a8d4" stroke-width="4"/>
    <rect x="20" y="55" width="100" height="18" rx="4" fill="#ec4899"/>
    <rect x="62" y="40" width="16" height="90" rx="4" fill="#db2777"/>
    <text x="70" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#374151">Toy</text>
  </g>
  <g transform="translate(220,100)">
    <rect width="140" height="140" rx="12" fill="#ffffff" stroke="#f9a8d4" stroke-width="4"/>
    <circle cx="70" cy="70" r="42" fill="#f472b6"/>
    <text x="70" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">👔</text>
    <text x="70" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#374151">Clothing</text>
  </g>
  <g transform="translate(380,100)">
    <rect width="140" height="140" rx="12" fill="#ffffff" stroke="#f9a8d4" stroke-width="4"/>
    <rect x="30" y="45" width="80" height="70" rx="8" fill="#fbb6ce"/>
    <rect x="55" y="35" width="30" height="20" rx="4" fill="#ec4899"/>
    <text x="70" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#374151">Accessory</text>
  </g>

  <!-- 12 category pills -->
  <g font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#831843">
    <rect x="540" y="80" width="110" height="36" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <text x="595" y="103" text-anchor="middle">Food</text>
    <rect x="660" y="80" width="110" height="36" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <text x="715" y="103" text-anchor="middle">Drink</text>
    <rect x="780" y="80" width="110" height="36" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <text x="835" y="103" text-anchor="middle">Book</text>
    <rect x="900" y="80" width="110" height="36" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <text x="955" y="103" text-anchor="middle">Music</text>
    <rect x="540" y="130" width="110" height="36" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <text x="595" y="153" text-anchor="middle">Electronics</text>
    <rect x="660" y="130" width="110" height="36" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <text x="715" y="153" text-anchor="middle">Furniture</text>
    <rect x="780" y="130" width="110" height="36" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <text x="835" y="153" text-anchor="middle">Sports</text>
    <rect x="900" y="130" width="110" height="36" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="2"/>
    <text x="955" y="153" text-anchor="middle">Plant</text>
  </g>

  <!-- Affinity meter -->
  <g transform="translate(540,230)">
    <text x="0" y="0" font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#831843">Affinity</text>
    <rect x="0" y="20" width="300" height="22" rx="6" fill="#fce7f3"/>
    <rect x="0" y="20" width="225" height="22" rx="6" fill="#ec4899"/>
    <text x="150" y="38" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#fff">85%</text>
    <text x="0" y="65" font-family="system-ui, sans-serif" font-size="16" fill="#831843">Outgoing · Leader</text>
  </g>

  <!-- Text block -->
  <g font-family="system-ui, sans-serif" font-size="22" fill="#374151">
    <text x="540" y="330">· Gift finder: category × personality affinity</text>
    <text x="540" y="370">· Searchable item database (40+ gifts)</text>
    <text x="540" y="410">· Wishlist + random gift picker</text>
    <text x="540" y="450">· 100% in your browser, no sign-up</text>
  </g>

  <text x="540" y="520" font-family="Courier New, monospace" font-size="40" font-weight="bold" fill="#831843">Gift &amp; Item Database</text>
  <text x="540" y="560" font-family="system-ui, sans-serif" font-size="20" fill="#831843">Tomodachi Life · 12 gift categories</text>

  <text x="540" y="610" font-family="Courier New, monospace" font-size="20" fill="#64748b">lifesimgrid.org</text>
</svg>