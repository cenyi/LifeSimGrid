<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="20" flood-color="rgba(0,0,0,0.2)" />
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.3)" />
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <rect x="60" y="60" width="1080" height="510" rx="32" fill="url(#cardGradient)" filter="url(#shadow)" />

  <g transform="translate(120, 100)">
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#1e293b">Tomodachi Life</text>
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#10b981">Personality Chart</text>
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Complete overview of all 16 personality types</text>
    <text x="0" y="160" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Groups, MBTI mappings, traits, and house colors</text>
  </g>

  <g transform="translate(120, 230)">
    <rect x="0" y="0" width="240" height="80" rx="12" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="2" />
    <text x="120" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#92400e">Outgoing</text>
    <text x="120" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b45309">E types · 4 personalities</text>

    <rect x="260" y="0" width="240" height="80" rx="12" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="2" />
    <text x="380" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#991b1b">Confident</text>
    <text x="380" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b91c1c">T/J types · 4 personalities</text>

    <rect x="520" y="0" width="240" height="80" rx="12" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="2" />
    <text x="640" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e3a8a">Independent</text>
    <text x="640" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">I types · 4 personalities</text>

    <rect x="780" y="0" width="240" height="80" rx="12" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="2" />
    <text x="900" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#065f46">Easygoing</text>
    <text x="900" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#047857">F types · 4 personalities</text>
  </g>

  <g transform="translate(120, 340)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1e293b">16</text>
    <text x="80" y="0" font-family="Arial, sans-serif" font-size="20" fill="#64748b">Personality Types</text>

    <text x="280" y="0" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1e293b">16</text>
    <text x="360" y="0" font-family="Arial, sans-serif" font-size="20" fill="#64748b">MBTI Mappings</text>

    <text x="560" y="0" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1e293b">4</text>
    <text x="620" y="0" font-family="Arial, sans-serif" font-size="20" fill="#64748b">Groups</text>

    <text x="760" y="0" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1e293b">4</text>
    <text x="820" y="0" font-family="Arial, sans-serif" font-size="20" fill="#64748b">Sliders</text>
  </g>

  <text x="600" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">LifeSimGrid.org — Fan-made tool, not affiliated with Nintendo</text>
</svg>
