<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#faf5ff" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="20" flood-color="rgba(0,0,0,0.2)" />
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.3)" />
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <rect x="60" y="60" width="1080" height="510" rx="32" fill="url(#cardGradient)" filter="url(#shadow)" />

  <!-- Character card preview -->
  <g transform="translate(100, 130)">
    <!-- Card background -->
    <rect x="0" y="0" width="280" height="280" rx="20" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
    <!-- MBTI badge -->
    <rect x="20" y="20" width="80" height="40" rx="10" fill="#a855f7"/>
    <text x="60" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">ENFP</text>
    <!-- Personality group badge -->
    <rect x="110" y="20" width="100" height="28" rx="14" fill="#fef3c7"/>
    <text x="160" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">Outgoing</text>
    <!-- Archetype badge -->
    <rect x="20" y="72" width="120" height="28" rx="14" fill="#fce7f3"/>
    <text x="80" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9f1239">The Hero</text>
    <!-- Character avatar circle -->
    <circle cx="140" cy="160" r="50" fill="#e9d5ff" stroke="#c084fc" stroke-width="3"/>
    <text x="140" y="175" text-anchor="middle" font-size="48">🎭</text>
    <!-- Info rows -->
    <text x="20" y="230" font-family="Arial, sans-serif" font-size="13" fill="#6b21a8" font-weight="bold">Name:</text>
    <text x="80" y="230" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">Sora-kun</text>
    <text x="20" y="255" font-family="Arial, sans-serif" font-size="13" fill="#6b21a8" font-weight="bold">Zodiac:</text>
    <text x="80" y="255" font-family="Arial, sans-serif" font-size="13" fill="#1e293b">♈ Aries</text>
  </g>

  <!-- Title section -->
  <text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" filter="url(#textShadow)">LifeSimGrid</text>

  <text x="600" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#1e293b">Tomodachi Life</text>
  <text x="600" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#9333ea">Character Ideas</text>
  <text x="600" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748b">Random Personality &amp; Appearance Generator</text>

  <!-- Feature tags -->
  <g transform="translate(380, 400)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#9333ea" opacity="0.1"/>
    <text x="65" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9333ea">🎲 Random Gen</text>
  </g>
  <g transform="translate(530, 400)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#f59e0b" opacity="0.1"/>
    <text x="70" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">⭐ 16 Personalities</text>
  </g>
  <g transform="translate(690, 400)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#22c55e" opacity="0.1"/>
    <text x="65" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e">🛡️ 100% Private</text>
  </g>

  <!-- Dice decoration -->
  <g transform="translate(1050, 550)">
    <circle cx="0" cy="0" r="30" fill="#9333ea"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">🎲</text>
  </g>

  <rect x="60" y="590" width="1080" height="2" rx="1" fill="#e2e8f0" opacity="0.5"/>
</svg>
